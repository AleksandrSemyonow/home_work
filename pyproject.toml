[tool.poetry]
name = "pythonproject"
version = "0.1.0"
description = ""
authors = ["User <shurbe96@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.1"
mypy = "^1.14.1"
black = "^24.10.0"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
max-line-length = 119
ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "venv", ".venv"]

[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
line-length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"
